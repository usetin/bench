name: Benchmarks (Linux)

# Native Linux measurements only; thresholds flag review, never bypass correctness CI.
#
# The suite lives here; the compiler and library it measures live in usetin/tin, so the revisions
# compared are tin's: run it on a tin performance PR with tin_ref=<branch or SHA> and
# tin_base=<its base>. Empty tin_ref measures usetin/tin main against its first parent.
on:
  workflow_dispatch:
    inputs:
      tin_ref:
        description: The tin revision to measure (branch, tag or SHA; empty is main)
        type: string
        default: ''
      tin_base:
        description: The tin revision to compare against (empty is the measured revision's first parent)
        type: string
        default: ''
      polls:
        description: Enable experimental CPU safepoints in the head compiler
        type: boolean
        default: false
      inline_sweep:
        description: Measure inline.tin thresholds at current, half, and double values
        type: boolean
        default: false
      amd64_runner:
        description: Runner for the amd64 job (dedicated requires a self-hosted tin-bench-amd64 runner)
        type: choice
        options:
          - shared
          - dedicated
        default: shared
  schedule:
    - cron: '0 6 * * 1'

defaults:
  run:
    shell: bash

env:
  TINC_POLLS: ${{ inputs.polls && '1' || '0' }}

permissions:
  contents: read

concurrency:
  group: bench-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'amd64' && inputs.amd64_runner == 'dedicated' && fromJSON('["self-hosted","linux","x64","tin-bench-amd64"]') || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out the tin revision to measure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: usetin/tin
          ref: ${{ inputs.tin_ref || 'main' }}
          path: tin
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve comparison revisions
        id: revisions
        env:
          BASE_REF: ${{ inputs.tin_base }}
        run: |
          head=$(git -C tin rev-parse HEAD)
          if [ -n "$BASE_REF" ]; then
            base=$(git -C tin rev-parse --verify --end-of-options "${BASE_REF}^{commit}")
          else
            base=$(git -C tin rev-parse --verify --end-of-options "${head}^^{commit}")
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          { echo "Base: $base"; echo "Head: $head"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check out the base tin revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: usetin/tin
          ref: ${{ steps.revisions.outputs.base }}
          path: tin-base
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tin/go.mod
          cache: false
      - name: Install wrk and h2load
        run: sudo apt-get update -q && sudo apt-get install -y -q wrk nghttp2-client
      - name: Build each revision from its own seed and source tree
        run: |
          mkdir -p bin
          make -C tin bootstrap
          make -C tin-base bootstrap
      - name: Inline threshold sweep (native Linux)
        if: ${{ inputs.inline_sweep }}
        env:
          TIN_ROOT: ${{ github.workspace }}/tin
        run: |
          {
            echo '### Inline threshold sweep'
            echo 'The variants run in an interleaved current, half, double, double, half, current order on this native Linux runner. Each starts from the checked-in seed, performs the two-build fixed-point bootstrap, then runs the seven-sample Tin/Go CPU suite in bench/v2.'
            echo '```'
            uname -a
            lscpu | grep -E '^(Model name|CPU\(s\)):' || true
            go version
            echo '```'
          } | tee bin/bench-inline-machine.txt
          cat bin/bench-inline-machine.txt >> "$GITHUB_STEP_SUMMARY"
          for spec in current:1:4:40:32 half:1:2:20:16 double:1:8:80:64 double:2:8:80:64 half:2:2:20:16 current:2:4:40:32; do
            IFS=: read -r variant repetition depth nodes literal <<< "$spec"
            git -C tin checkout -- toolchain/compiler/inline.tin
            if [ "$variant" != current ]; then
              sed -i "s/il_depth < 4/il_depth < $depth/" tin/toolchain/compiler/inline.tin
              sed -i "s/il_size(cast(ReturnStmt, r).value) <= 40/il_size(cast(ReturnStmt, r).value) <= $nodes/" tin/toolchain/compiler/inline.tin
              sed -i "s/cast(StrLit, lit).len <= 32/cast(StrLit, lit).len <= $literal/" tin/toolchain/compiler/inline.tin
            fi
            rm -f tin/bin/tinc
            rm -rf tin/bin/s2 tin/bin/s3
            /usr/bin/time -f '%e' -o "bin/bench-inline-$variant-$repetition-bootstrap-seconds.txt" make -s -C tin bootstrap 2>&1 | tee "bin/bench-inline-$variant-$repetition-bootstrap.txt"
            echo "### $variant run $repetition (depth=$depth, expression nodes=$nodes, append literal bytes=$literal)" >> "$GITHUB_STEP_SUMMARY"
            echo "Bootstrap fixed-point time: $(cat "bin/bench-inline-$variant-$repetition-bootstrap-seconds.txt") s" >> "$GITHUB_STEP_SUMMARY"
            BENCH_DIR=v2 sh tools/ci/tin.sh run.tin --json "bin/bench-inline-$variant-$repetition.json" | tee "bin/bench-inline-$variant-$repetition.txt"
            cat "bin/bench-inline-$variant-$repetition.txt" >> "$GITHUB_STEP_SUMMARY"
          done
          git -C tin checkout -- toolchain/compiler/inline.tin
      - name: Machine and measurement settings
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; *) exit 1 ;; esac
          test "$arch" = "$EXPECTED_ARCH"
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          kernel=$(uname -srmo)
          go=$(go version)
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            machine="Self-hosted runner $RUNNER_NAME"
          elif [ "$EXPECTED_ARCH" = arm64 ]; then
            machine="GitHub-hosted ubuntu-24.04-arm shared runner ($RUNNER_NAME)"
          else
            machine="GitHub-hosted ubuntu-24.04 shared runner ($RUNNER_NAME)"
          fi
          {
            echo "## Linux $EXPECTED_ARCH benchmark run (shared-runner ratios only)"
            echo '| field | value |'
            echo '|---|---|'
            echo "| machine | $machine |"
            echo "| CPU | $cpu |"
            echo "| kernel | $kernel |"
            echo "| Go | $go |"
            echo "| architecture | $EXPECTED_ARCH |"
            echo "| runner environment | $RUNNER_ENVIRONMENT |"
            echo "| compiler option | TINC_POLLS=$TINC_POLLS (head opt-in; base uses its committed default) |"
            echo "| load generator | $(wrk --version 2>&1 | head -n 1) |"
            echo "| HTTP/2 tool | $(h2load --version 2>&1 | head -n 1) |"
            echo "| tin base | $(git -C tin-base rev-parse --short HEAD) |"
            echo "| tin head | $(git -C tin rev-parse --short HEAD) |"
            echo 'CPU: 7 alternating runs per side; medians. HTTP: 1 server core, wrk -t2 -c100, 10 s, 5 alternating rounds; load generator on the same runner.'
            echo 'HTTPS: 1 server core each (anvil.ServeTLS, Go crypto/tls), TLS 1.3, wrk -t2, 5 s, 5 alternating rounds: handshakes/s (Connection: close), keep-alive req/s, MiB/s of 1 MiB bodies.'
            echo 'CPU head/base is elapsed time (lower is faster); HTTP head/base is req/s (higher is faster). >5% regressions require a rerun and profile/maintainer review; timing is not an automatic merge gate.'
          } | tee bin/bench-linux-summary.md
          cp bin/bench-linux-summary.md bin/bench-machine.txt
          cat bin/bench-machine.txt >> "$GITHUB_STEP_SUMMARY"
      - name: ARM64 atomic contention (automatic LSE versus forced fallback)
        if: matrix.arch == 'arm64'
        run: |
          if grep -Eq '^Features.*(^|[[:space:]])atomics([[:space:]]|$)' /proc/cpuinfo; then
            sh tin/tools/ci/tin.sh atomic_perf | tee bin/bench-atomic.txt
            cat bin/bench-atomic.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Atomic contention comparison skipped: this Linux arm64 CPU does not report HWCAP_ATOMICS.' | tee bin/bench-atomic.txt
            cat bin/bench-atomic.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: CPU reference (Tin versus Go)
        env:
          TIN_ROOT: ${{ github.workspace }}/tin
        run: |
          BENCH_DIR=v2 sh tools/ci/tin.sh run.tin --json bin/bench-cpu-reference.json | tee bin/bench-cpu-reference.txt
          { echo '### CPU reference'; cat bin/bench-cpu-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: CPU base versus head
        env:
          TIN_ROOT: ${{ github.workspace }}/tin
        run: |
          sh tools/ci/tin.sh compare.tin --base-root tin-base --head-root tin --json bin/bench-cpu-compare.json | tee bin/bench-cpu-compare.txt
          { echo '### CPU revision comparison'; cat bin/bench-cpu-compare.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP reference (Tin versus Go)
        env:
          TIN_ROOT: ${{ github.workspace }}/tin
        run: |
          sh tin/tin build tin/examples/api.tin -o bin/api
          go -C http build -o "$GITHUB_WORKSPACE/bin/fast" ./fast
          go -C http build -o "$GITHUB_WORKSPACE/bin/gonet" ./gonet
          http/run_wrk.sh 1 2 100 10 5 --json bin/bench-http-reference.json | tee bin/bench-http-reference.txt
          { echo '### HTTP reference'; cat bin/bench-http-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTPS reference (anvil.ServeTLS versus Go crypto/tls)
        env:
          TIN_ROOT: ${{ github.workspace }}/tin
        run: |
          sh tin/tin build http/https.tin -o bin/https_bench
          go -C http build -o "$GITHUB_WORKSPACE/bin/gotls" ./gotls
          go -C http build -o "$GITHUB_WORKSPACE/bin/tlsload" ./tlsload
          sh tools/ci/tin.sh http/run_https.tin 5 5 --json bin/bench-https-reference.json | tee bin/bench-https-reference.txt
          { echo '### HTTPS reference (anvil.ServeTLS versus Go crypto/tls)'; cat bin/bench-https-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP/2 reference (Tin versus Go net/http, h2c)
        env:
          TIN_ROOT: ${{ github.workspace }}/tin
        run: |
          go -C http build -o "$GITHUB_WORKSPACE/bin/goh2c" ./goh2c
          echo 'HTTP/2: 1 server core, h2load -t2 -c32 -m10 (h2c by prior knowledge), 10 s after a 2 s warm-up, 5 alternating rounds.' > bin/bench-h2-reference.txt
          sh tools/ci/tin.sh http/run_h2load.tin 1 2 32 10 10 5 --json bin/bench-h2-reference.json | tee -a bin/bench-h2-reference.txt
          { echo '### HTTP/2 reference'; cat bin/bench-h2-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP client (wire's HTTP/2 and HTTP/1.1 against Go's net/http client)
        env:
          TIN_ROOT: ${{ github.workspace }}/tin
        run: |
          sh tin/tin build http/wire_load.tin -o bin/wire_load
          go -C http build -o "$GITHUB_WORKSPACE/bin/goload" ./goload
          go -C http build -o "$GITHUB_WORKSPACE/bin/goh2c" ./goh2c
          echo 'HTTP client: 1 client core each (wire, Go net/http with GOMAXPROCS=1) calling Go net/http (2 cores), 100 callers at once, 20000 GETs of /plaintext per round, 5 alternating rounds after a warm-up.' > bin/bench-wire.txt
          sh tools/ci/tin.sh http/run_wire.tin 20000 5 --json bin/bench-wire.json | tee -a bin/bench-wire.txt
          { echo '### HTTP client (wire)'; cat bin/bench-wire.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP base versus head
        env:
          TIN_ROOT: ${{ github.workspace }}/tin
        run: |
          sh tools/ci/tin.sh compare.tin --suite http --base-root tin-base --head-root tin --json bin/bench-http-compare.json | tee bin/bench-http-compare.txt
          { echo '### HTTP revision comparison'; cat bin/bench-http-compare.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: File reads (quarry.ReadFile of 10k files, io_uring versus helper threads)
        env:
          TIN_ROOT: ${{ github.workspace }}/tin
        run: |
          sh tools/ci/tin.sh files/run.tin --json bin/bench-files.json | tee bin/bench-files.txt
          { echo '### File reads (head: io_uring versus TIN_IO_URING=0)'; echo '```'; cat bin/bench-files.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep raw samples and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-linux-${{ matrix.arch }}
          path: |
            bin/bench-*.txt
            bin/bench-linux-summary.md
            bin/bench-*.json
            bin/wrk-*/*.log
            bin/h2load-*/*.log
          retention-days: 90
          if-no-files-found: ignore
