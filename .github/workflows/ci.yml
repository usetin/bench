name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out the tin toolchain
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: usetin/tin
          path: tin
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tin/go.mod
          cache: false
      - name: Build the compiler from the checked-in seed
        run: make -C tin bin/tinc
      - name: The benchmark harness self-test
        run: TIN_ROOT="$PWD/tin" sh tools/ci/tin.sh test_benchmarks
      - name: Every benchmark and Go twin compiles
        run: TIN_ROOT="$PWD/tin" sh tools/ci/check.sh
